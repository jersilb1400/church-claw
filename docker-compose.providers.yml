services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    profiles: ["providers"]
    env_file:
      - .env.churchclaw
    volumes:
      - ./churchclaw/config/litellm.config.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    command:
      - "--config"
      - "/app/config.yaml"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "4000"
    restart: unless-stopped
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    profiles: ["providers"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
